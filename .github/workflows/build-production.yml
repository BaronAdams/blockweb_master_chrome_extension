name: Build Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env.production
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.production
          echo "VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}" >> .env.production
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env.production
          echo "RESET_PASSWORD_URL=${{ secrets.RESET_PASSWORD_URL }}" >> .env.production
          echo "CONFIRM_EMAIL_URL=${{ secrets.CONFIRM_EMAIL_URL }}" >> .env.production

      - name: Build
        run: npm run build:production

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-production-${{ github.sha }}
          path: dist/
          retention-days: 30

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: release-production-${{ github.sha }}
          path: release/
          retention-days: 30
