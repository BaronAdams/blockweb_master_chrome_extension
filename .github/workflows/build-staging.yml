name: Build Staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env.staging
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.staging
          echo "VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}" >> .env.staging
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env.staging
          echo "RESET_PASSWORD_URL=${{ secrets.RESET_PASSWORD_URL }}" >> .env.staging
          echo "CONFIRM_EMAIL_URL=${{ secrets.CONFIRM_EMAIL_URL }}" >> .env.staging

      - name: Build
        run: npm run build:staging

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-staging-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: release-staging-${{ github.sha }}
          path: release/
          retention-days: 14
